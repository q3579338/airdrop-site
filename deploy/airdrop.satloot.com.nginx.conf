# airdrop.satloot.com —— 空投项目展示站(纯静态,由 /opt/airdrop-site/build.mjs 每 10 分钟生成到 /var/www/airdrop-satloot)
# 装法:deploy/setup.sh 会放到 sites-available 并软链;手动则 nginx -t && systemctl reload nginx。
# 证书沿用本机自签(Cloudflare 橙云 Full 模式回源),与 earn.satloot.com / tool.satloot.com 一致。
# 不反代、不开放任何写接口。

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name airdrop.satloot.com;

    ssl_certificate     /etc/ssl/certs/satloot-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/satloot-selfsigned.key;

    root /var/www/airdrop-satloot;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    gzip_vary on;

    # 页面与数据每 10 分钟重生成,别让 Cloudflare 和浏览器缓存住旧的
    location ~ \.(html|json|xml|txt)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
